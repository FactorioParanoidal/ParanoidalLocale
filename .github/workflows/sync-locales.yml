name: Synchronize locales with Crowdin

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: locale-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract current mod sources and local translations
        run: ./build.sh ExtractLocalizationToJsons

      - name: Remove stale local translation files and keys
        run: ./build.sh CleanLocaleFiles

      - name: Validate extracted locales
        run: ./build.sh ValidateLocales

      - name: Upload current sources and remove obsolete Crowdin files
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_sources_args: --delete-obsolete
          upload_translations: false
          download_translations: false
          push_sources: false
          push_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Import current Russian translations
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: true
          upload_language: ru
          auto_approve_imported: true
          import_eq_suggestions: true
          download_translations: false
          push_sources: false
          push_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Download approved translations
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          export_only_approved: true
          skip_untranslated_strings: true
          push_sources: false
          push_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Fix downloaded locale ownership
        run: sudo chown -R "$(id -u):$(id -g)" ParanoidalLocale.Data/locale

      - name: Remove empty and stale downloaded files
        run: ./build.sh CleanLocaleFiles

      - name: Validate downloaded locales
        run: ./build.sh ValidateLocales

      - name: Reject translations moved into source directory
        shell: bash
        run: |
          invalid_renames=$(git diff HEAD --name-status --find-renames -- ParanoidalLocale.Data/locale \
            | awk '$1 ~ /^R/ && $2 !~ /\/initial\// && $3 ~ /\/initial\// { print }')
          if [[ -n "$invalid_renames" ]]; then
            echo "Crowdin produced invalid translation-to-source renames:"
            echo "$invalid_renames"
            exit 1
          fi

          translation_deletions=$(git diff HEAD --name-status -- ParanoidalLocale.Data/locale \
            | awk '$1 == "D" && $2 ~ /\/locale\/(ru|uk)\// { count++ } END { print count + 0 }')
          if (( translation_deletions > 20 )); then
            echo "Refusing to create a PR with $translation_deletions deleted translation files."
            exit 1
          fi

      - name: Create or update synchronization pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.LOCALE_SYNC_TOKEN }}
          branch: automation/crowdin-locales-v2
          delete-branch: true
          commit-message: 'Synchronize locales with Crowdin'
          title: 'Synchronize locales with Crowdin'
          body: 'Automated source, approved translation, and obsolete-file synchronization.'
          labels: localization, automated

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-operation == 'created' || steps.create-pr.outputs.pull-request-operation == 'updated'
        run: gh pr merge "${{ steps.create-pr.outputs.pull-request-url }}" --auto --squash
        env:
          GH_TOKEN: ${{ secrets.LOCALE_SYNC_TOKEN }}
